<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <style>
    .latin { font-family: 'Georgia', 'Times New Roman', serif; }
    .mono  { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }

    .vp-glow { animation: glow-pulse 4s ease-in-out infinite; }
    @keyframes glow-pulse {
      0%, 100% { opacity: .3; }
      50%      { opacity: .7; }
    }

    .cursor { animation: blink 1.1s step-end infinite; fill: #3B82F6; }
    @keyframes blink { 50% { opacity: 0; } }

    .underline { stroke-dasharray: 400; animation: draw 5s ease-out infinite; }
    @keyframes draw {
      0%   { stroke-dashoffset: 400; opacity: 0; }
      10%  { opacity: 1; }
      50%  { stroke-dashoffset: 0; opacity: 1; }
      85%  { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* depth bands scan from horizon (b5) toward viewer (b1) */
    .band { animation: band-scan 5s ease-in-out infinite; }
    .band.b5 { animation-delay: 0s; }
    .band.b4 { animation-delay: .3s; }
    .band.b3 { animation-delay: .6s; }
    .band.b2 { animation-delay: .9s; }
    .band.b1 { animation-delay: 1.2s; }
    @keyframes band-scan {
      0%, 100% { opacity: .06; }
      30%, 55% { opacity: .3; }
    }

    .lane { animation: lane-breathe 5s ease-in-out infinite; }
    @keyframes lane-breathe {
      0%, 100% { opacity: .45; }
      50%      { opacity: .8; }
    }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0"  stop-color="#0b0e14"/>
      <stop offset=".6" stop-color="#10131b"/>
      <stop offset="1"  stop-color="#0b0e14"/>
    </linearGradient>

    <!-- VP glow at convergence point (840, 45) -->
    <radialGradient id="vpGlow" cx="840" cy="45" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#3B82F6" stop-opacity=".6"/>
      <stop offset=".4"  stop-color="#3B82F6" stop-opacity=".15"/>
      <stop offset="1"   stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- mask: track invisible on left, fades in x=450→620, full x=620→900 -->
    <linearGradient id="fadeGrad" x1="450" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="black"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="trackMask" maskUnits="userSpaceOnUse">
      <rect x="450" y="0" width="170" height="300" fill="url(#fadeGrad)"/>
      <rect x="620" y="0" width="280" height="300" fill="white"/>
    </mask>
  </defs>

  <!-- background -->
  <rect width="900" height="300" fill="url(#bgGrad)"/>

  <!-- horizon glow at vanishing point -->
  <ellipse class="vp-glow" cx="840" cy="45" rx="240" ry="150" fill="url(#vpGlow)"/>

  <!-- ── PERSPECTIVE TRACK (masked, fades in from right) ── -->
  <g mask="url(#trackMask)">

    <!-- lane dividers radiating from VP (840,45) to bottom -->
    <!-- wider gap at bottom = closer to viewer; converge at top = horizon -->
    <g class="lane" stroke="#3B82F6" stroke-width="1.2">
      <line x1="840" y1="45" x2="370" y2="300" opacity=".45"/>
      <line x1="840" y1="45" x2="480" y2="300" opacity=".55"/>
      <line x1="840" y1="45" x2="585" y2="300" opacity=".65"/>
      <line x1="840" y1="45" x2="678" y2="300" opacity=".72"/>
      <line x1="840" y1="45" x2="758" y2="300" opacity=".68"/>
      <line x1="840" y1="45" x2="828" y2="300" opacity=".55"/>
    </g>

    <!-- depth bands — dashed markers across the track at each perspective depth -->
    <!-- formula: d=depth(0=near,1=horizon), y=300-d*255, left_x=840+(370-840)*(1-d) -->

    <!-- b5 — near horizon: d=0.75, y=109, left_x=722 -->
    <line class="band b5" x1="722" y1="109" x2="900" y2="109"
          stroke="#3B82F6" stroke-width=".8" stroke-dasharray="3 9"/>

    <!-- b4 — d=0.60, y=147, left_x=652 -->
    <line class="band b4" x1="652" y1="147" x2="900" y2="147"
          stroke="#3B82F6" stroke-width="1" stroke-dasharray="5 9"/>

    <!-- b3 — d=0.45, y=185, left_x=582 -->
    <line class="band b3" x1="582" y1="185" x2="900" y2="185"
          stroke="#3B82F6" stroke-width="1.1" stroke-dasharray="7 9"/>

    <!-- b2 — d=0.30, y=223, left_x=511 -->
    <line class="band b2" x1="511" y1="223" x2="900" y2="223"
          stroke="#3B82F6" stroke-width="1.3" stroke-dasharray="10 9"/>

    <!-- b1 — closest to viewer: d=0.15, y=262, left_x=441 -->
    <line class="band b1" x1="441" y1="262" x2="900" y2="262"
          stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="14 9"/>
  </g>

  <!-- ── TEXT AREA ── -->
  <text class="mono" x="200" y="90" font-size="13" fill="#3B82F6" letter-spacing="3">@JoaoMendss</text>

  <text class="latin" x="200" y="152" font-size="40" font-weight="700"
        fill="#f0f0eb" letter-spacing="2">JOÃO MENDES</text>

  <path class="underline" d="M202 168 Q390 160 598 166"
        stroke="#3B82F6" stroke-width="4" stroke-linecap="round" fill="none"/>

  <text class="latin" x="202" y="198" font-size="13" fill="#9aa4b2" letter-spacing="7">FULL STACK DEVELOPER</text>

  <text class="mono" x="202" y="233" font-size="13" fill="#3B82F6">$</text>
  <text class="mono" x="218" y="233" font-size="13" fill="#8b949e">npm run build --watch</text>
  <rect class="cursor" x="390" y="221" width="7" height="14"/>
</svg>
